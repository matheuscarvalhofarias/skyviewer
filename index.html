<script>
const byId=id=>document.getElementById(id);
byId('eye').onclick=()=>{const field=byId('password'),show=field.type==='password';field.type=show?'text':'password';byId('eye').setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');byId('eye').setAttribute('aria-pressed',show)};
const workspace = byId('workspace');
let activeMap;
let opened = false;
let currentPage = 'Mapa';
let pinMode = false;
const basemaps = [
  {id:'streets',name:'Ruas',description:'Ruas, bairros e endereços',style:'streets-v12'},
  {id:'outdoors',name:'Relevo',description:'Terreno, trilhas e áreas naturais',style:'outdoors-v12'},
  {id:'light',name:'Claro',description:'Fundo claro para destacar as camadas',style:'light-v11'},
  {id:'night',name:'Escuro',description:'Fundo escuro para destacar as camadas',style:'dark-v11'}
];
let selectedBasemap = 'outdoors';
const basemapConfig = {showPlaceLabels:true,showRoadLabels:true,showTransitLabels:true,showPointOfInterestLabels:true,showAdminBoundaries:true};
function layerMatches(id,prop) {
  if(prop==='showPlaceLabels')return /settlement|country-label|state-label|place-label/.test(id);
  if(prop==='showAdminBoundaries')return /admin-/.test(id);
  if(prop==='showPointOfInterestLabels')return /poi-label/.test(id);
  if(prop==='showRoadLabels')return /road-label/.test(id);
  return /transit|airport-label/.test(id);
}
function applyLayerPreferences() {
  if(!activeMap)return;
  for(const layer of activeMap.getStyle().layers || []){
    const prop=Object.keys(basemapConfig).find(prop=>layerMatches(layer.id,prop));
    if(prop)activeMap.setLayoutProperty(layer.id,'visibility',opened && basemapConfig[prop]?'visible':'none');
  }
}
let switchingBasemap = false;
let basemapTimer;
let basemapError = '';
function selectBasemap(id) {
  const next = basemaps.find(item=>item.id===id);
  if(!next || !mapReady || switchingBasemap || id===selectedBasemap)return;
  entryFlight++;
  activeMap.stop();
  const previous=selectedBasemap;
  selectedBasemap=id;
  basemapError='';
  switchingBasemap=true;
  mapReady=false;
  activeMap.setStyle('mapbox://styles/mapbox/'+next.style);
  showPage('Mapas');
  basemapTimer=setTimeout(()=>{
    if(!switchingBasemap)return;
    const fallback=basemaps.find(item=>item.id===previous);
    selectedBasemap=previous;
    basemapError='Não foi possível carregar o mapa escolhido. Restaurando o anterior.';
    activeMap.setStyle('mapbox://styles/mapbox/'+fallback.style);
    showPage(currentPage);
  },20000);
}
function showBasemaps(drawer) {
  const intro=document.createElement('p');intro.textContent='Escolha o mapa base.';drawer.append(intro);
  const group=document.createElement('div');group.className='basemap-options';
  group.setAttribute('role','group');group.setAttribute('aria-label','Mapa base');
  basemaps.forEach(item=>{
    const button=document.createElement('button');button.type='button';
    button.className='basemap-option';button.disabled=!mapReady;
    button.setAttribute('aria-pressed',String(selectedBasemap===item.id));
    const preview=document.createElement('span');preview.className='basemap-preview '+item.id;preview.setAttribute('aria-hidden','true');
    const text=document.createElement('span'),name=document.createElement('strong'),description=document.createElement('small');
    name.textContent=item.name;description.textContent=item.description;text.append(name,description);
    button.append(preview,text);button.onclick=()=>selectBasemap(item.id);group.append(button);
  });
  drawer.append(group);
  const status=document.createElement('p');status.setAttribute('role','status');
  status.textContent=basemapError || (mapReady?'Mapa base: '+basemaps.find(item=>item.id===selectedBasemap).name:'Carregando mapa base…');
  drawer.append(status);
}
const places = [
  ['Brasil',-51.9,-14.2,3],['Brasília',-47.88,-15.79,10],['São Paulo',-46.63,-23.55,10],
  ['Rio de Janeiro',-43.17,-22.91,10],['Manaus',-60.02,-3.12,10],['Salvador',-38.5,-12.97,10],
  ['Recife',-34.88,-8.05,10],['Fortaleza',-38.52,-3.73,10],['Buenos Aires',-58.38,-34.6,9],
  ['Lisboa',-9.14,38.72,10],['Londres',-.12,51.5,10],['Nova York',-74,40.71,10]
];
const pins = [];
const paths = {
 cube:'m12 3 9 5v9l-9 5-9-5V8z M3 8l9 5 9-5 M12 13v9 M7.5 5.5l9 5',
 shield:'M12 2 3 6v5c0 6 5 10 9 12 4-2 9-6 9-12V6z M8 12l3 3 5-6',
 menu:'M4 5h16v14H4z M10 5v14',globe:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0 M2 12h20 M12 2c-6 5-6 15 0 20 6-5 6-15 0-20',
 layers:'m2 8 10-5 10 5-10 5z M3 12l9 5 9-5 M3 16l9 5 9-5',bookmark:'M6 3h12v18l-6-4-6 4z',
 pin:'M19 10c0 5-7 12-7 12S5 15 5 10a7 7 0 1 1 14 0z M14 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0',
 exit:'M10 4H4v16h6 M9 12h12 M17 8l4 4-4 4',search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0 M15 15l6 6',
 home:'M3 11l9-8 9 8 M6 10v11h12V10',plus:'M12 5v14 M5 12h14',minus:'M5 12h14',
 compass:'m17 6-3 8-8 4 4-9z',expand:'M3 9V3h6 M15 3h6v6 M21 15v6h-6 M9 21H3v-6'
};
workspace.querySelectorAll('[data-icon]').forEach(el => {
  el.insertAdjacentHTML('afterbegin','<svg aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[el.dataset.icon]+'"/></svg>');
});

function globeView() {
  const size = Math.min(activeMap.getContainer().clientWidth*.9,innerHeight*.91);
  return {center:[-48,-9],zoom:Math.log2(size/169),pitch:0,bearing:0};
}
// Keep the destination fixed throughout each flight to avoid mid-flight corrections.
const neighborhoods = [[-49.272,-25.405],[-47.885,-15.824],[-51.201,-30.036],[-46.703,-23.546]];
const entryCenter = neighborhoods[Math.floor(Math.random()*neighborhoods.length)];
const entryCamera = {center:entryCenter,zoom:16,bearing:0,pitch:0,duration:4800,curve:1,
  easing:t=>(1-Math.cos(Math.PI*t))/2};
function preloadEntry() {
  if(activeMap && mapReady && !opened && !motionPreference.matches)
    activeMap.flyTo({...entryCamera,preloadOnly:true});
}
let entryFlight = 0;
let arrivalMarker;
function flyToBrazil() {
  const map = activeMap;
  const ticket = ++entryFlight;
  const center = entryCenter;
  arrivalMarker?.remove();
  arrivalMarker = undefined;
  map.once('moveend', () => {
    if (!opened || ticket !== entryFlight) return;
    const dot = document.createElement('div');
    dot.className = 'arrival-dot';
    dot.setAttribute('role','img');
    dot.setAttribute('aria-label','Ponto de chegada');
    arrivalMarker = new mapboxgl.Marker({element:dot}).setLngLat(center).addTo(map);
  });
  // One uninterrupted camera path, with gentle acceleration and deceleration.
  // Avoid waiting for tile loading or querying buildings during the animation.
  map.flyTo(entryCamera);
}
function applyMode() {
  if (!activeMap || !mapReady) return;
  activeMap.stop();
  activeMap.resize();
  applyLayerPreferences();
  for(const handler of ['dragPan','dragRotate','scrollZoom','doubleClickZoom','touchZoomRotate','keyboard','boxZoom']){
    activeMap[handler][opened?'enable':'disable']();
  }
  if(opened) flyToBrazil();
}

function pageTitle(page){return {'Search & Acquire Images':'Imagens de satélite',Security:'Segurança'}[page]||page}
function showPage(page) {
  if(page!=='Security'&&cameraEventFilters.drawing)cancelCameraDrawing();
  if(page!=='3D'&&models3D.picking)cancelModel3DPick();
  const previousPage=currentPage;
  currentPage=page;
  syncModels3DVisibility();
  restoreCameraArea();
  for(const id of ['security-events-points','security-events-route'])if(activeMap?.getLayer(id))activeMap.setLayoutProperty(id,'visibility',page==='Security'?'visible':'none');
  pinMode=false;
  if(activeMap) activeMap.getCanvas().style.cursor=cameraEventFilters.drawing?'crosshair':'';
  const drawer=byId('drawer');
  workspace.querySelectorAll('[data-page]').forEach(b=>{
    b.classList.toggle('selected',b.dataset.page===page);
    b.setAttribute('aria-label',pageTitle(b.dataset.page));
  });
  drawer.classList.toggle('imagery-drawer',page==='Search & Acquire Images');
  drawer.classList.toggle('security-drawer',page==='Security');
  drawer.classList.toggle('model3d-drawer',page==='3D');
  drawer.classList.toggle('territory-drawer',page==='Camadas');
  drawer.replaceChildren();
  if(previousPage!==page)drawer.scrollTop=0;
  drawer.hidden=page==='Mapa';
  if(drawer.hidden) return;
  const heading=document.createElement('h2');heading.textContent=pageTitle(page);drawer.append(heading);
  function action(name,callback) {
    const b=document.createElement('button');b.textContent=name;b.onclick=callback;b.className=name.startsWith('+')?'sec-primary':'saved-map-card';drawer.append(b);
  }
  if(page==='Mapas'){showBasemaps(drawer);return}
  if(!mapReady){drawer.append('Carregando mapa…');return}
  if(page==='Camadas'){showTerritoryPanel(drawer);return}
  if(page==='Search & Acquire Images'){showImageSearch(drawer);return}
  if(page==='Security'){showSecurity(drawer);return}
  if(page==='3D'){showModels3D(drawer,previousPage!==page);return}
  if(page==='Camadas') {
    for(const [name,prop] of [['Nomes de lugares','showPlaceLabels'],['Limites administrativos','showAdminBoundaries'],['Pontos de interesse','showPointOfInterestLabels']]){
      const label=document.createElement('label'),input=document.createElement('input');
      input.type='checkbox';input.checked=basemapConfig[prop];
      input.onchange=()=>{basemapConfig[prop]=input.checked;applyLayerPreferences()};
      label.append(input,name);drawer.append(label);
    }
  } else {
    action('+ Marcar ponto no mapa',()=>{pinMode=true;activeMap.getCanvas().style.cursor='crosshair';drawer.lastElementChild.textContent='Clique no mapa para marcar um ponto.'});
    pins.forEach((pin,i)=>action('Ponto '+(i+1),()=>activeMap.flyTo({center:pin.getLngLat(),zoom:8})));
    const note=document.createElement('p');note.textContent=pins.length?'':'Nenhum ponto marcado.';drawer.append(note);
  }
}
workspace.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(currentPage===b.dataset.page?'Mapa':b.dataset.page));
byId('collapse').onclick=()=>{
  workspace.classList.toggle('compact');
  document.body.style.setProperty('--left-rail',workspace.classList.contains('compact')?'64px':'190px');
  activeMap?.resize();
};
byId('homeMap').onclick=()=>activeMap?.flyTo(globeView());
byId('closer').onclick=()=>activeMap?.zoomIn();
byId('further').onclick=()=>activeMap?.zoomOut();
byId('north').onclick=()=>activeMap?.resetNorthPitch();
byId('fullMap').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
function searchPlaces(){
  const query=byId('lookup').value.trim(),results=byId('results');results.replaceChildren();
  if(!query)return;
  const normalize=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const matches=places.filter(p=>normalize(p[0]).includes(normalize(query))).slice(0,5);
  const coords=query.split(',').map(t=>t.trim());
  if(coords.length===2 && coords.every(t=>t!==''&&Number.isFinite(Number(t))) && Math.abs(+coords[0])<=90 && Math.abs(+coords[1])<=180)
    matches.unshift([query,+coords[1],+coords[0],9]);
  matches.forEach(([name,lng,lat,zoom])=>{
    const b=document.createElement('button');b.textContent=name;b.onclick=()=>{
      activeMap?.flyTo({center:[lng,lat],zoom});byId('lookup').value='';results.replaceChildren();
    };results.append(b);
  });
  if(!matches.length){const p=document.createElement('p');p.textContent='Local não encontrado. Tente latitude, longitude.';results.append(p)}
}
byId('lookup').oninput=searchPlaces;
byId('lookup').onkeydown=e=>{if(e.key==='Enter')byId('results').querySelector('button')?.click();if(e.key==='Escape'){e.target.value='';searchPlaces()}};
byId('form').onsubmit=e=>{
  e.preventDefault();opened=true;byId('password').value='';document.body.classList.add('in-map');workspace.hidden=false;
  showPage('Mapa');updateTerritoryMap();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!opened)return;
    applyMode();byId('lookup').focus({preventScroll:true});
  }));
};
byId('logout').onclick=()=>{arrivalMarker?.remove();arrivalMarker=undefined;entryFlight++;opened=false;workspace.hidden=true;document.body.classList.remove('in-map');
  byId('form').reset();byId('password').type='password';byId('eye').setAttribute('aria-pressed','false');byId('eye').setAttribute('aria-label','Mostrar senha');
  clearModels3D();clearSecurityMap();securityState.service=null;clearImageSearch();byId('lookup').value='';searchPlaces();pins.splice(0).forEach(p=>p.remove());showPage('Mapa');
  updateTerritoryMap();
  if(activeMap && mapReady){basemapConfig.showAdminBoundaries=true;applyMode();activeMap.jumpTo({center:[-53,-13],zoom:Math.log2(Math.min(innerHeight*1.24,innerWidth*1.65)/185),bearing:0,pitch:0})}
  byId('email').focus();
};

</script>

<script>
const MAPBOX_PUBLIC_TOKEN = window.MAPBOX_TOKEN || localStorage.getItem('mapbox_token') || ['pk', 'eyJ1IjoibWF0aGV1c2ZmYXJpYXMtOTgiLCJhIjoiY213NDNtNGJyMDBkODJ5cG1vOXdtbW01eiJ9', 'OosGL1cctbtPaUzj89vBbw'].join('.');
const statusText = byId('mapStatus');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let mapReady = false;
function unavailable(status) {
  statusText.hidden = false;
  statusText.textContent = status ? 'Mapbox indisponível (HTTP ' + status + ').' : 'Não foi possível carregar o Mapbox.';
}
function startMap() {
  try {
    const world = document.querySelector('.world');
    // A fixed star field outside the globe. Mapbox draws only the moving Earth.
    let seed = 137;
    function random() {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    }
    const stars = Array.from({length: 240}, () => {
      const x = (random()*100).toFixed(2), y = (random()*100).toFixed(2);
      const alpha = (.22 + random()*.48).toFixed(2);
      return 'radial-gradient(circle at '+x+'% '+y+'%,rgba(217,235,248,'+alpha+') 0.7px,transparent 1.2px)';
    });
    world.style.setProperty('--stars', stars.join(','));
    function globeZoom() {
      const size = Math.min(world.clientHeight*1.24, world.clientWidth*1.65);
      world.style.setProperty('--clear-radius', (size*.52)+'px');
      return Math.log2(size / 185);
    }
    const map = new mapboxgl.Map({
      container: 'map',
      accessToken: MAPBOX_PUBLIC_TOKEN,
      style: 'mapbox://styles/mapbox/'+basemaps.find(item=>item.id===selectedBasemap).style,
      pixelRatio: 1,
      fadeDuration: 0,
      projection: 'globe', center: [-53, -13], zoom: globeZoom(), interactive: false
    });
    activeMap = map;
    initModel3DInteractions(map);
    map.on('move', () => {
      if(opened){const center=map.getCenter();const text=center.lat.toFixed(4)+'°, '+center.lng.toFixed(4)+'°';if(byId('coords').textContent!==text)byId('coords').textContent=text}
    });
    map.on('mousedown', () => {entryFlight++});
    map.on('touchstart', () => {entryFlight++});
    map.on('wheel', () => {entryFlight++});
    workspace.addEventListener('pointerdown', () => {entryFlight++});
    map.on('click', e => {
      if(!opened)return;
      if(handleCameraAreaClick(e))return;
      if(handleModel3DClick(e))return;
      if(!pinMode && handleTerritoryClick(e))return;
      if(!pinMode)return;
      pins.push(new mapboxgl.Marker({color:'#be2945'}).setLngLat(e.lngLat).addTo(map));
      showPage('Marcadores');
    });
    map.on('style.load', () => {
      applyLayerPreferences();
      restoreImageLayers();
      restoreSecurityLayers();
      restoreCameraArea();
      restoreModels3D();
      restoreTerritoryLayers();
      map.setProjection('globe');
      map.setFog({color:'#ceebff','high-color':'#285890','space-color':'#061426','horizon-blend':0.018,'star-intensity':0});
      if(switchingBasemap){
        clearTimeout(basemapTimer);
        switchingBasemap=false;mapReady=true;statusText.hidden=true;
        if(opened)showPage(currentPage);else applyMode();
      }
    });
    map.on('resize', () => {if(!opened)map.setZoom(globeZoom())});
    function rotate() {
      if (opened || motionPreference.matches || document.hidden || !mapReady) return;
      const center = map.getCenter();
      map.easeTo({center: [center.lng + 1.2, center.lat], duration: 1000, easing: t => t});
    }
    map.on('moveend', rotate);
    motionPreference.addEventListener('change', () => motionPreference.matches ? map.stop() : rotate());
    document.addEventListener('visibilitychange', () => document.hidden ? map.stop() : rotate());
    map.on('error', event => unavailable(event.error?.status));
    map.once('load', () => {

        statusText.hidden = true;
        mapReady = true; restoreTerritoryLayers(); if(opened){applyMode();showPage(currentPage)}else {preloadEntry();rotate()}
    });
  } catch { unavailable(); }
}
const base = 'https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl';
const css = document.createElement('link');
css.rel = 'stylesheet'; css.href = base + '.css'; document.head.append(css);
const js = document.createElement('script');
js.src = base + '.js'; js.onload = startMap; js.onerror = () => unavailable(); document.head.append(js);
</script></body></html>
